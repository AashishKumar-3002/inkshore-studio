appId: studio.inkshore.desktop
productName: Inkshore Studio
copyright: Copyright © 2026 Aashish Kumar
# Include OS and architecture so release uploads never overwrite another build.
artifactName: Inkshore-Studio-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

# Only the shell itself is packed; the Next server is added as an
# unpacked resource by scripts/build-desktop.mjs (see extraResources).
files:
  - src/**/*
  - build/icons/icon.png
  - build/icons/icon.ico
  - package.json

extraResources:
  - from: ../.next/standalone
    to: server
  # electron-builder does not include standalone node_modules when copying
  # the server tree. The complete traced tree is required: Next itself and
  # its transitive server dependencies load before the first request, while
  # PGlite and Drizzle are loaded by the preflight migration.
  - from: ../.next/standalone/node_modules
    to: server/node_modules
  - from: ../.next/static
    to: server/.next/static
  - from: ../public
    to: server/public

mac:
  category: public.app-category.productivity
  icon: build/icons/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  # Notarization needs an Apple Developer account; until then the app is
  # unsigned and Gatekeeper will warn on first open.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  icon: build/icons/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]

linux:
  icon: build/icons/png
  executableName: inkshore-studio
  category: Office
  synopsis: Local-first fiction writing and AI editing
  desktop:
    entry:
      Name: Inkshore Studio
      Comment: Write, organize, and revise your stories
      Keywords: writing;fiction;novel;editor;
      StartupWMClass: Inkshore Studio
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Inkshore Studio
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: build/icons/icon.ico
  uninstallerIcon: build/icons/icon.ico

dmg:
  title: Inkshore Studio ${version}
  icon: build/icons/icon.icns

deb:
  maintainer: Aashish Kumar <aashish201810kumar@gmail.com>
