name: Bug report
description: Report a reproducible problem in Inkshore Studio.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please remove secrets and private manuscript text from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: 0.1.0, or a commit hash for development builds
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS Apple Silicon desktop, Windows x64 desktop, or web browser and OS
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the provider and model if the problem involves AI generation.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Desktop server logs are available from the Help menu.
